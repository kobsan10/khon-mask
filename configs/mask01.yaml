# Primary subject: a single well-preserved Khon mask (e.g. Thotsakan or
# Hanuman), chosen for its mix of fine crown detail and matte/gilded surfaces.
#
#   python scripts/00_prepare_images.py -c configs/mask01.yaml --input ~/khon_photos
#   python scripts/01_sfm.py            -c configs/mask01.yaml
#   ...

extends: default.yaml

name: mask01

paths:
  subject: mask01
  run_id: mask01

mask:
  # A mask photographed on a turntable needs foreground masking or COLMAP will
  # reconstruct the room instead of the object.
  enabled: true
  method: rembg
  # Khon crowns have fine open silhouettes; erode less so ornament survives,
  # and check figures/mask_previews/ before trusting the result.
  erode_px: 3

sfm:
  # 60-100 photos of one object: exhaustive matching is affordable and handles
  # loop closure between the first and last frames of the orbit.
  matcher: exhaustive
  max_num_features: 12000   # fine crown ornament rewards more features

mesh:
  # Higher depth resolves crown detail. Drop to 9 if the mesh becomes noisy,
  # which happens when the dense cloud is thin.
  poisson_depth: 11
  density_trim_quantile: 0.04

texture:
  mode: uv                  # a real texture map for the deliverable model
  blend: median             # the defence against gilded highlights
